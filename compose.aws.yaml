# Standalone AWS configuration: do not combine with the local Compose files.
x-app: &app
  env_file:
    - path: ./secrets/runtime.env
      format: raw
  init: true
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  networks: [runtime]
  stop_grace_period: 45s
  volumes: ["./secrets/rds-ca.pem:/run/secrets/rds-ca.pem:ro"]
  healthcheck:
    test: [CMD, /app/rachata, healthcheck]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 45s
  logging: &aws-logs
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:?Set AWS_REGION}
      awslogs-group: ${AWS_LOG_GROUP:?Set the existing CloudWatch log group}
      mode: non-blocking
      max-buffer-size: 4m
services:
  api:
    <<: *app
    profiles: [web]
    image: ${API_IMAGE:?Set an immutable API image digest}
    environment: {APP_MODE: api}
    mem_limit: 768m
    cpus: "1.0"
  web:
    profiles: [web]
    image: ${WEB_IMAGE:?Set an immutable web image digest}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [runtime]
    ports: ["80:8080"]
    volumes: ["./deploy/aws/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/ready]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *aws-logs
  worker:
    <<: *app
    profiles: [worker]
    image: ${WORKER_IMAGE:?Set an immutable worker image digest}
    environment: {APP_MODE: worker}
    volumes:
      - ./secrets/rds-ca.pem:/run/secrets/rds-ca.pem:ro
      - /srv/rachata-scratch:/srv/media
    mem_limit: 2g
    cpus: "2.0"
networks:
  runtime:
    ipam:
      config: [{subnet: "172.30.84.0/24"}]
