worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No cookies, Authorization, or query strings in access logs.
    log_format requests '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout requests;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 101m;
        client_body_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        set $api http://api:8080;

        location = /health { access_log off; return 200 'ok'; }
        location = /ready { proxy_pass $api; }

        location ~ ^/(auth|api|media)/ {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            # Overwrite client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Go authorizes the public /media route before emitting X-Accel-Redirect.
        # These paths cannot be requested directly, even by an administrator.
        location ~ '^/_hls/(?<storage_key>[0-9a-f]{32})/(?<media_kind>full|preview)/(?<media_file>index\.m3u8|segment_[0-9]{6}\.ts)$' {
            internal;
            alias /srv/media/$storage_key/$media_kind/$media_file;
            disable_symlinks on;
            types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
            max_ranges 1;
            add_header Cache-Control 'private, no-store' always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
        location /_hls/ { return 404; }
        location /storage/ { return 404; }
        location /source { return 404; }
        location ~ /\. { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
    }
}
