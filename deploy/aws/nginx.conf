worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No queries, cookies, presigned URLs or playback tokens in logs.
    log_format requests '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout requests;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # These are the ALB subnets in stack.yaml; change together if using a custom VPC.
    set_real_ip_from 10.42.0.0/24;
    set_real_ip_from 10.42.1.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $http_x_forwarded_proto $client_proto { default http; https https; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Original videos go directly to S3; only metadata/normalized images use API.
        client_max_body_size 40m;
        client_body_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        set $api http://api:8080;
        location = /health { access_log off; return 200 'ok'; }
        location = /ready { proxy_pass $api; }
        location ~ ^/(auth|api|media)/ {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_proto;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        location /_hls/ { return 404; }
        location /storage/ { return 404; }
        location /source { return 404; }
        location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
    }
}
